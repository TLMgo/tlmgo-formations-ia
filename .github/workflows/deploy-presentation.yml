# Deploy all presentations to GitHub Pages
#
# REQUIRED (one-time): Settings → Pages → Source: "GitHub Actions"
#
# Live URLs (per course):
#   https://tlmgo.github.io/tlmgo-formations-ia/<course>/
#   e.g. .../specs_workflow/

name: Deploy presentations to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'rules/presentation/**'
      - 'commands_n_skills/presentation/**'
      - 'hooks/presentation/**'
      - 'spec_driven/presentation/**'
      - 'mcp/presentation/**'
      - 'subagents/presentation/**'
      - 'model_arena/presentation/**'
      - 'specs_workflow/presentation/**'
      - '.github/workflows/deploy-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build combined site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          for c in rules commands_n_skills hooks spec_driven mcp subagents model_arena specs_workflow; do
            mkdir -p "_site/$c/presentation"
            cp "$c"/presentation/* "_site/$c/presentation/"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URLs
        run: |
          echo "::notice title=Site live::${{ steps.deployment.outputs.page_url }}"
          echo "Accueil:       ${{ steps.deployment.outputs.page_url }}"
          echo "Les SPECS:     ${{ steps.deployment.outputs.page_url }}specs_workflow/presentation/"
